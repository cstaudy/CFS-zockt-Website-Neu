name: Production-backup design preflight (FAKE DATA ONLY)

# FAKE-DATA TEST ONLY. No Render access, no production secrets, no environment secrets.
# This file must not be adapted for production without a separate security review.
on:
  pull_request:
    paths:
      - '.github/workflows/manual-production-backup-fake-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-data-preflight:
    name: PostgreSQL 18 fake export, authenticated encryption, isolated restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: postgres:18
    services:
      fake-source:
        image: postgres:18
        env:
          POSTGRES_USER: fake_user
          POSTGRES_PASSWORD: fake-source-password
          POSTGRES_DB: fake_db
        options: >-
          --health-cmd "pg_isready -U fake_user -d fake_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
      fake-restore:
        image: postgres:18
        env:
          POSTGRES_USER: restore_user
          POSTGRES_PASSWORD: fake-restore-password
          POSTGRES_DB: restored_db
        options: >-
          --health-cmd "pg_isready -U restore_user -d restored_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Make synthetic PostgreSQL 18 archive
        shell: bash
        env:
          PGPASSWORD: fake-source-password
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/cfs-preflight
          psql -X -v ON_ERROR_STOP=1 -h fake-source -U fake_user -d fake_db <<'SQL'
          CREATE TABLE fake_preflight (id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, label text NOT NULL UNIQUE);
          INSERT INTO fake_preflight(label) VALUES ('fake-one'), ('fake-two');
          SQL
          pg_dump -h fake-source -U fake_user -d fake_db -Fc --no-owner --no-acl -f /tmp/cfs-preflight/fake.dump
          pg_restore --list /tmp/cfs-preflight/fake.dump > /dev/null
      - name: Encrypt and authenticate fake archive (public synthetic-only key)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          apt-get update -qq
          apt-get install -y -qq python3-cryptography > /dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.exceptions import InvalidTag
          p = Path('/tmp/cfs-preflight')
          # Public test key. NEVER use for real backups.
          key = bytes.fromhex('6a' * 32)
          aad = b'cfs-preflight-fake-only-v1'
          nonce = os.urandom(12)
          ciphertext = AESGCM(key).encrypt(nonce, (p / 'fake.dump').read_bytes(), aad)
          blob = b'CFSFAKE3' + nonce + ciphertext
          (p / 'fake.enc').write_bytes(blob)
          (p / 'fake.dump').unlink()
          altered = bytearray(blob)
          altered[-1] ^= 1
          try:
              AESGCM(key).decrypt(nonce, bytes(altered[20:]), aad)
          except InvalidTag:
              pass
          else:
              raise AssertionError('Tampered fake archive was accepted')
          recovered = AESGCM(key).decrypt(blob[8:20], blob[20:], aad)
          (p / 'recovered.dump').write_bytes(recovered)
          PY
          pg_restore --list /tmp/cfs-preflight/recovered.dump > /dev/null
      - name: Restore only to synthetic isolated PostgreSQL 18 service
        shell: bash
        env:
          PGPASSWORD: fake-restore-password
        run: |
          set -euo pipefail
          pg_restore -h fake-restore -U restore_user -d restored_db --no-owner --no-acl --exit-on-error /tmp/cfs-preflight/recovered.dump
          count="$(psql -XAt -v ON_ERROR_STOP=1 -h fake-restore -U restore_user -d restored_db -c 'SELECT count(*) FROM fake_preflight')"
          next_id="$(psql -XAt -v ON_ERROR_STOP=1 -h fake-restore -U restore_user -d restored_db -c "INSERT INTO fake_preflight(label) VALUES ('fake-three') RETURNING id")"
          test "$count" = 2
          test "$next_id" = 3
          echo 'PASS: FAKE DATA ONLY; PG18 custom dump, AES-GCM tamper rejection and isolated restore'
      - name: Remove temporary fake files
        if: always()
        shell: bash
        run: rm -rf /tmp/cfs-preflight
