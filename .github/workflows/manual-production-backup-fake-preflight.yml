name: Production-backup design preflight (FAKE DATA ONLY)

# FAKE-DATA TEST ONLY. No Render access, no production secrets, no environment secrets.
# This file must not be adapted for production without a separate security review.
on:
  pull_request:
    paths:
      - '.github/workflows/manual-production-backup-fake-preflight.yml'
      - 'scripts/backup/pg18_backup_crypto.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-data-preflight:
    name: PostgreSQL 18 fake export, authenticated encryption, isolated restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: postgres:18
    services:
      fake-source:
        image: postgres:18
        env:
          POSTGRES_USER: fake_user
          POSTGRES_PASSWORD: fake-source-password
          POSTGRES_DB: fake_db
        options: >-
          --health-cmd "pg_isready -U fake_user -d fake_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
      fake-restore:
        image: postgres:18
        env:
          POSTGRES_USER: restore_user
          POSTGRES_PASSWORD: fake-restore-password
          POSTGRES_DB: restored_db
        options: >-
          --health-cmd "pg_isready -U restore_user -d restored_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Make synthetic PostgreSQL 18 archive
        shell: bash
        env:
          PGPASSWORD: fake-source-password
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/cfs-preflight
          psql -X -v ON_ERROR_STOP=1 -h fake-source -U fake_user -d fake_db <<'SQL'
          CREATE TABLE fake_preflight (id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, label text NOT NULL UNIQUE);
          INSERT INTO fake_preflight(label) VALUES ('fake-one'), ('fake-two');
          SQL
          pg_dump -h fake-source -U fake_user -d fake_db -Fc --no-owner --no-acl -f /tmp/cfs-preflight/fake.dump
          pg_restore --list /tmp/cfs-preflight/fake.dump > /dev/null
      - name: Encrypt and authenticate fake archive (public synthetic-only key)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          apt-get update -qq
          apt-get install -y -qq python3-cryptography > /dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.exceptions import InvalidTag
          p = Path('/tmp/cfs-preflight')
          # Public test key. NEVER use for real backups.
          key = bytes.fromhex('6a' * 32)
          aad = b'cfs-preflight-fake-only-v1'
          nonce = os.urandom(12)
          ciphertext = AESGCM(key).encrypt(nonce, (p / 'fake.dump').read_bytes(), aad)
          blob = b'CFSFAKE3' + nonce + ciphertext
          (p / 'fake.enc').write_bytes(blob)
          (p / 'fake.dump').unlink()
          altered = bytearray(blob)
          altered[-1] ^= 1
          try:
              AESGCM(key).decrypt(nonce, bytes(altered[20:]), aad)
          except InvalidTag:
              pass
          else:
              raise AssertionError('Tampered fake archive was accepted')
          recovered = AESGCM(key).decrypt(blob[8:20], blob[20:], aad)
          (p / 'recovered.dump').write_bytes(recovered)
          PY
          pg_restore --list /tmp/cfs-preflight/recovered.dump > /dev/null
      - name: Restore only to synthetic isolated PostgreSQL 18 service
        shell: bash
        env:
          PGPASSWORD: fake-restore-password
        run: |
          set -euo pipefail
          pg_restore -h fake-restore -U restore_user -d restored_db --no-owner --no-acl --exit-on-error /tmp/cfs-preflight/recovered.dump
          count="$(psql -XqAt -v ON_ERROR_STOP=1 -h fake-restore -U restore_user -d restored_db -c 'SELECT count(*) FROM fake_preflight')"
          next_id="$(psql -XqAt -v ON_ERROR_STOP=1 -h fake-restore -U restore_user -d restored_db -c "INSERT INTO fake_preflight(label) VALUES ('fake-three') RETURNING id")"
          test "$count" = 2
          test "$next_id" = 3
          echo 'PASS: FAKE DATA ONLY; PG18 custom dump, AES-GCM tamper rejection and isolated restore'
      - name: Remove temporary fake files
        if: always()
        shell: bash
        run: rm -rf /tmp/cfs-preflight

  crypto-utility-fake-roundtrip:
    name: Production-format encryption utility fake-only roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cryptography for synthetic test
        run: python3 -m pip install --disable-pip-version-check --no-input 'cryptography==46.0.3'
      - name: Verify format, decryption, wrong-key rejection and tamper detection
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          export CFS_BACKUP_KEY_B64="$(python3 -c 'import base64; print(base64.b64encode(bytes.fromhex("71"*32)).decode())')"
          printf 'PGDMPFAKE-ONLY-NO-USER-DATA' > "$tmp/fake.dump"
          python3 scripts/backup/pg18_backup_crypto.py encrypt "$tmp/fake.dump" "$tmp/fake.enc"
          python3 scripts/backup/pg18_backup_crypto.py decrypt "$tmp/fake.enc" "$tmp/roundtrip.dump"
          cmp "$tmp/fake.dump" "$tmp/roundtrip.dump"
          python3 - "$tmp/fake.enc" "$tmp/tampered.enc" <<'PY'
          from pathlib import Path
          import sys
          blob = bytearray(Path(sys.argv[1]).read_bytes())
          blob[-1] ^= 1
          Path(sys.argv[2]).write_bytes(blob)
          PY
          if python3 scripts/backup/pg18_backup_crypto.py decrypt "$tmp/tampered.enc" "$tmp/tampered.dump"; then
            echo 'ERROR: tampered file accepted'; exit 1
          fi
          export CFS_BACKUP_KEY_B64="$(python3 -c 'import base64; print(base64.b64encode(bytes.fromhex("72"*32)).decode())')"
          if python3 scripts/backup/pg18_backup_crypto.py decrypt "$tmp/fake.enc" "$tmp/wrong-key.dump"; then
            echo 'ERROR: wrong key accepted'; exit 1
          fi
          echo 'PASS: fake-only production-format crypto roundtrip, tamper and wrong-key rejection'
