name: Synthetic PostgreSQL 18 backup and restore validation
# Safe to run on pull requests: synthetic data only; no production connections or secrets.
on:
  pull_request:
    paths:
      - '.github/workflows/manual-pg18-backup-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: postgres:18
    services:
      source:
        image: postgres:18
        env:
          POSTGRES_USER: synthetic_user
          POSTGRES_PASSWORD: synthetic-only-password
          POSTGRES_DB: synthetic_source
        options: >-
          --health-cmd "pg_isready -U synthetic_user -d synthetic_source"
          --health-interval 5s --health-timeout 5s --health-retries 12
      restore:
        image: postgres:18
        env:
          POSTGRES_USER: restore_user
          POSTGRES_PASSWORD: synthetic-restore-password
          POSTGRES_DB: synthetic_restore
        options: >-
          --health-cmd "pg_isready -U restore_user -d synthetic_restore"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Generate synthetic records and export PostgreSQL custom dump
        shell: bash
        env:
          PGPASSWORD: synthetic-only-password
        run: |
          set -euo pipefail
          umask 077
          psql -X -v ON_ERROR_STOP=1 -h source -U synthetic_user -d synthetic_source <<'SQL'
          CREATE TABLE synthetic_backup_check (id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, label text NOT NULL UNIQUE, CONSTRAINT nonempty_label CHECK (length(label) > 0));
          INSERT INTO synthetic_backup_check (label) VALUES ('fake-alpha'), ('fake-beta');
          SQL
          pg_dump -h source -U synthetic_user -d synthetic_source -Fc --no-owner --no-acl -f /tmp/synthetic.dump
          pg_restore --list /tmp/synthetic.dump > /dev/null
      - name: Restore into a different isolated database and compare records
        shell: bash
        env:
          PGPASSWORD: synthetic-restore-password
        run: |
          set -euo pipefail
          pg_restore -h restore -U restore_user -d synthetic_restore --no-owner --no-acl --exit-on-error /tmp/synthetic.dump
          count="$(psql -XAt -v ON_ERROR_STOP=1 -h restore -U restore_user -d synthetic_restore -c 'SELECT count(*) FROM synthetic_backup_check')"
          labels="$(psql -XAt -v ON_ERROR_STOP=1 -h restore -U restore_user -d synthetic_restore -c "SELECT string_agg(label, ',' ORDER BY id) FROM synthetic_backup_check")"
          test "$count" = 2
          test "$labels" = 'fake-alpha,fake-beta'
          # Verify that identity sequence, unique constraint and CHECK constraint survived restore.
          next_id="$(psql -XqAt -v ON_ERROR_STOP=1 -h restore -U restore_user -d synthetic_restore -c "INSERT INTO synthetic_backup_check (label) VALUES ('fake-gamma') RETURNING id")"
          test "$next_id" = 3
          if psql -XAt -v ON_ERROR_STOP=1 -h restore -U restore_user -d synthetic_restore -c "INSERT INTO synthetic_backup_check (label) VALUES ('fake-alpha')" > /dev/null 2>&1; then
            echo 'UNIQUE constraint missing after restore'; exit 1
          fi
          if psql -XAt -v ON_ERROR_STOP=1 -h restore -U restore_user -d synthetic_restore -c "INSERT INTO synthetic_backup_check (label) VALUES ('')" > /dev/null 2>&1; then
            echo 'CHECK constraint missing after restore'; exit 1
          fi
          echo 'Synthetic isolated PostgreSQL 18 restore passed: records, identity sequence and constraints'
      - name: Remove temporary synthetic dump
        if: always()
        shell: bash
        run: rm -f /tmp/synthetic.dump

  synthetic-authenticated-encryption:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install test-only authenticated encryption library
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --user 'cryptography==46.0.3'
      - name: Test AES-256-GCM roundtrip and tamper rejection with fake bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.exceptions import InvalidTag

          fake_dump = b'SYNTHETIC-ONLY-FAKE-POSTGRES-DUMP-NO-USER-DATA'
          key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          aad = b'cfs-zockt-synthetic-backup-v1'
          ciphertext = AESGCM(key).encrypt(nonce, fake_dump, aad)
          assert AESGCM(key).decrypt(nonce, ciphertext, aad) == fake_dump

          altered = bytearray(ciphertext)
          altered[0] ^= 1
          for test_key, test_nonce, test_ciphertext, test_aad in (
              (key, nonce, bytes(altered), aad),
              (AESGCM.generate_key(bit_length=256), nonce, ciphertext, aad),
              (key, nonce, ciphertext, b'wrong-metadata'),
          ):
              try:
                  AESGCM(test_key).decrypt(test_nonce, test_ciphertext, test_aad)
              except InvalidTag:
                  pass
              else:
                  raise AssertionError('Authenticated decryption accepted a modified input')
          print('Synthetic AES-256-GCM roundtrip and tamper/wrong-key rejection passed')
          PY

  synthetic-artifact-create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install test-only encryption dependency
        run: python3 -m pip install --disable-pip-version-check --no-input 'cryptography==46.0.3'
      - name: Encrypt synthetic-only file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p synthetic-output
          python3 - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          # Public fixed test key: safe ONLY because the plaintext is fake.
          key = bytes.fromhex('42' * 32)
          nonce = os.urandom(12)
          fake = b'SYNTHETIC-BACKUP-TRANSFER-CHECK-v1'
          blob = b'CFSFAKE1' + nonce + AESGCM(key).encrypt(nonce, fake, b'synthetic-transfer-v1')
          Path('synthetic-output/synthetic-only.enc').write_bytes(blob)
          PY
      - name: Upload encrypted fake artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-only-encrypted-transfer
          path: synthetic-output/synthetic-only.enc
          if-no-files-found: error
          retention-days: 1

  synthetic-artifact-retrieve:
    needs: synthetic-artifact-create
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifact into independent job
        uses: actions/download-artifact@v4
        with:
          name: synthetic-only-encrypted-transfer
          path: synthetic-input
      - name: Install test-only encryption dependency
        run: python3 -m pip install --disable-pip-version-check --no-input 'cryptography==46.0.3'
      - name: Authenticate and verify independently downloaded fake file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.exceptions import InvalidTag
          blob = Path('synthetic-input/synthetic-only.enc').read_bytes()
          assert blob[:8] == b'CFSFAKE1'
          key = bytes.fromhex('42' * 32)  # Public synthetic-only key, NEVER for production.
          nonce, ciphertext = blob[8:20], blob[20:]
          assert AESGCM(key).decrypt(nonce, ciphertext, b'synthetic-transfer-v1') == b'SYNTHETIC-BACKUP-TRANSFER-CHECK-v1'
          modified = bytearray(blob)
          modified[-1] ^= 1
          try:
              AESGCM(key).decrypt(nonce, bytes(modified[20:]), b'synthetic-transfer-v1')
          except InvalidTag:
              pass
          else:
              raise AssertionError('Tampered downloaded artifact accepted')
          print('Downloaded synthetic artifact authenticated and verified in a separate job')
          PY
