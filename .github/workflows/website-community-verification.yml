name: Website community verification
on:
  push:
    branches:
      - development/website-community
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/development/website-community'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run repository checks
        run: npm run check
        env:
          DATABASE_URL: ''
          SESSION_SECRET: ''
