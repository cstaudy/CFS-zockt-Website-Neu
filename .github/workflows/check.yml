name: Website checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cfs_ci
          POSTGRES_USER: cfs_ci
          POSTGRES_PASSWORD: ci_test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cfs_ci -d cfs_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: PostgreSQL registration and creator end-to-end
        env:
          DATABASE_URL: postgresql://cfs_ci:ci_test_only_password@127.0.0.1:5432/cfs_ci
          DATABASE_SSL: 'false'
          SESSION_SECRET: ci-local-test-secret-only
          CFS_CI_DATABASE_ACCEPTANCE: 'yes'
        run: |
          npm run migrate
          node scripts/test-account-creator-flow.mjs
